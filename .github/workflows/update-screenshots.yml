name: Update screenshots

on:
  schedule:
    - cron: "17 */6 * * *"   # every 6 hours
  workflow_dispatch:          # "Run workflow" button for an instant refresh
  push:
    paths: ["sites.json", "scripts/**", ".github/workflows/update-screenshots.yml"]

permissions:
  contents: write

concurrency:
  group: screenshots
  cancel-in-progress: true

jobs:
  screenshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1
          npx playwright install --with-deps chromium
      - name: Take screenshots of the live sites
        run: node scripts/screenshot.mjs
      - name: Commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add images README.md
          if git diff --cached --quiet -- images; then
            echo "No visual changes"
          else
            git commit -m "Refresh screenshots"
            git push
          fi
